name: Test Go
on: [push]
jobs:
  lint-test-build:
    name: Test, Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version-file: "go.mod"
        id: go

      - name: Install Dependencies
        env:
          GOPROXY: https://proxy.golang.org,direct
        run: go mod download

      - name: Test
        # -coverpkg=./... credits coverage across package boundaries, so code
        # exercised through integration tests is counted for the packages that
        # own it, not only by each package's own unit tests.
        run: go test -tags unit -race -coverprofile=coverage.out -covermode=atomic -coverpkg=./... ./...

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5.1.2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Build
        run: go build -v ./...
